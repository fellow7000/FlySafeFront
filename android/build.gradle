// Plugin versions are defined once, in settings.gradle.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Set root build directory to '../build'
rootProject.buildDir = '../build'

// Set build directories for subprojects
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Ensure ':app' is evaluated before other subprojects
subprojects {
    project.evaluationDependsOn(':app')
}

// Clean task to delete the build directory
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
